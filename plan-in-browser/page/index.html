<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planning canvas</title>
  <link rel="stylesheet" href="/assets/highlight-github.min.css">
  <style>
    :root { color-scheme: light; --ink:#1f2937; --muted:#78716c; --line:#e7e5e4; --paper:#fff; --wash:#fafaf9; --accent:#4f46e5; --accent-soft:#eef2ff; --success:#047857; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--wash); color:var(--ink); font:15px/1.55 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(1440px,calc(100% - 32px)); margin:0 auto; padding:36px 0 48px; }
    #workspace { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; height:calc(100vh - 148px); min-height:480px; }
    .pane { min-width:0; overflow-y:auto; padding:2px 10px 32px 2px; }
    #artifact-pane { border-left:1px solid var(--line); padding-left:24px; }
    .pane-title { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:0 0 16px; }
    .pane-title h2 { font-size:22px; }
    .pane-title span { color:var(--muted); font-size:13px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:24px; border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:28px; }
    h1,h2 { font-family:ui-serif,Georgia,Cambria,"Times New Roman",serif; font-weight:600; color:#0f172a; }
    h1 { margin:0; font-size:32px; letter-spacing:-.02em; }
    h2 { margin:0; font-size:20px; line-height:1.35; }
    #topic { color:var(--muted); margin-top:3px; }
    #status { color:#a8a29e; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    #banner { display:none; position:sticky; top:0; z-index:5; padding:6px; background:#fef3c7; color:#92400e; text-align:center; font-size:13px; }
    #banner.visible { display:block; }
    #cards { display:grid; gap:18px; }
    article { border:1px solid var(--line); border-radius:12px; background:var(--paper); padding:22px; box-shadow:0 1px 2px rgb(15 23 42 / .03); }
    article.active { border:2px solid var(--accent); box-shadow:0 8px 24px rgb(79 70 229 / .08); }
    article.editing { border-color:#d97706; }
    article.pending { opacity:.6; border-style:dashed; }
    .card-head { display:flex; justify-content:space-between; align-items:start; gap:16px; }
    .context { margin:6px 0 0; color:var(--muted); }
    .recommendation { margin:14px 0; padding:9px 11px; border-radius:7px; background:var(--accent-soft); color:#3730a3; font-size:14px; }
    .options { display:grid; gap:4px; margin-top:16px; }
    .option { display:flex; align-items:start; gap:10px; padding:8px 6px; border-radius:7px; cursor:pointer; }
    .option:hover { background:#f5f5f4; }
    .option input { margin-top:5px; }
    .option strong { display:block; font-weight:600; }
    .detail { color:var(--muted); font-size:14px; }
    textarea { width:100%; margin-top:14px; min-height:78px; resize:vertical; border:1px solid #d6d3d1; border-radius:8px; padding:10px 11px; color:var(--ink); background:#fff; font:inherit; }
    textarea:focus { outline:2px solid #c7d2fe; border-color:var(--accent); }
    .actions { display:flex; gap:10px; align-items:center; margin-top:16px; }
    button { border:0; border-radius:8px; padding:9px 14px; cursor:pointer; font:600 14px/1.2 inherit; }
    button.primary { color:#fff; background:var(--accent); }
    button.primary:hover { background:#4338ca; }
    button.quiet { color:var(--muted); background:transparent; font-weight:500; }
    button.link { padding:2px; color:var(--accent); background:transparent; font-size:13px; font-weight:500; }
    .answers { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
    .chip { border-radius:999px; padding:3px 9px; background:#ecfdf5; color:var(--success); font-size:13px; }
    blockquote { margin:10px 0 0; border-left:2px solid #d6d3d1; padding-left:12px; color:#57534e; }
    #thinking { display:none; align-items:center; gap:12px; margin-top:18px; border:1px dashed #c7d2fe; border-radius:12px; background:#f8faff; padding:18px 20px; color:#6366f1; }
    #thinking.visible { display:flex; }
    .spinner { width:18px; height:18px; flex:0 0 auto; border:2px solid #c7d2fe; border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    #session-actions { margin-top:30px; padding-top:18px; border-top:1px solid var(--line); text-align:right; }
    #done { display:none; margin-top:36px; text-align:center; color:var(--muted); }
    #artifact-list { display:grid; gap:10px; }
    #artifact-empty { margin:6px 0; padding:22px; border:1px dashed var(--line); border-radius:10px; color:var(--muted); text-align:center; }
    details.artifact { overflow:hidden; border:1px solid var(--line); border-radius:10px; background:var(--paper); }
    details.artifact[open] { box-shadow:0 3px 14px rgb(15 23 42 / .05); }
    details.artifact summary { display:flex; align-items:center; gap:9px; padding:12px 14px; cursor:pointer; font-weight:600; overflow-wrap:anywhere; }
    details.artifact summary::before { content:"›"; color:var(--muted); font-size:20px; line-height:1; transition:transform .12s ease; }
    details.artifact[open] summary::before { transform:rotate(90deg); }
    .artifact-path { min-width:0; flex:1; }
    .artifact-language { flex:0 0 auto; color:var(--muted); font:500 11px/1.2 ui-sans-serif,system-ui,sans-serif; letter-spacing:.08em; text-transform:uppercase; }
    .artifact-error { padding:12px 14px; border-top:1px solid var(--line); color:#b91c1c; background:#fef2f2; }
    .artifact-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; border-top:1px solid var(--line); padding:8px 12px; background:#fafaf9; }
    .artifact-view-options { display:flex; gap:2px; padding:2px; border:1px solid var(--line); border-radius:7px; background:#fff; }
    button.artifact-view { padding:5px 9px; border-radius:5px; color:var(--muted); background:transparent; font-size:12px; font-weight:600; }
    button.artifact-view.active { color:#3730a3; background:var(--accent-soft); }
    .diff-summary { color:var(--muted); font-size:12px; }
    .diff-summary .additions { color:#047857; }
    .diff-summary .deletions { color:#b91c1c; }
    pre { max-height:70vh; margin:0; overflow:auto; border-top:1px solid var(--line); padding:16px; background:#fafaf9; color:#292524; font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; tab-size:2; white-space:pre; }
    pre.artifact-file { border-top:0; }
    pre code.hljs { padding:0; background:transparent; overflow:visible; }
    .diff-scroll { max-height:70vh; overflow:auto; background:#fff; font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; tab-size:2; }
    .diff-hunk { width:max-content; min-width:100%; }
    .diff-hunk + .diff-hunk { border-top:1px solid #d6d3d1; }
    .diff-hunk-header { position:sticky; left:0; padding:7px 12px; color:#4338ca; background:#eef2ff; border-bottom:1px solid #e0e7ff; white-space:pre; }
    .diff-line { display:grid; grid-template-columns:44px 44px 22px minmax(max-content,1fr); min-height:20px; }
    .diff-line.context { background:#fff; }
    .diff-line.addition { background:#ecfdf5; }
    .diff-line.deletion { background:#fff1f2; }
    .diff-line.note { color:var(--muted); background:#fafaf9; }
    .diff-line-number { padding:0 7px; color:#a8a29e; border-right:1px solid rgb(120 113 108 / .14); text-align:right; user-select:none; }
    .diff-marker { color:#a8a29e; text-align:center; user-select:none; }
    .diff-line.addition .diff-marker { color:#047857; }
    .diff-line.deletion .diff-marker { color:#b91c1c; }
    .diff-code { min-width:0; padding:0 12px 0 4px; color:#292524; background:transparent; white-space:pre; }
    .diff-code.hljs { padding:0 12px 0 4px; background:transparent; overflow:visible; }
    @media (prefers-reduced-motion:reduce) { .spinner { animation-duration:1.8s; } }
    @media (max-width:800px) {
      main { width:min(100% - 20px,780px); padding-top:28px; }
      #workspace { display:block; height:auto; }
      .pane { overflow:visible; padding-right:2px; }
      #artifact-pane { margin-top:34px; padding-top:28px; padding-left:2px; border-top:1px solid var(--line); border-left:0; }
      article { padding:17px; }
      header { align-items:start; }
    }
  </style>
</head>
<body>
  <div id="banner">Reconnecting to the planning session…</div>
  <main>
    <header>
      <div><h1>Planning canvas</h1><div id="topic"></div></div>
      <div id="status">Connecting</div>
    </header>
    <div id="workspace">
      <section id="decision-pane" class="pane" aria-label="Planning decisions">
        <div class="pane-title"><h2>Decisions</h2><span>Answer one at a time</span></div>
        <section id="cards"></section>
        <div id="thinking" role="status" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <span id="thinking-label">Generating the next question…</span>
        </div>
        <div id="session-actions"><button id="cancel-session" class="quiet">Cancel session</button></div>
        <div id="done"></div>
      </section>
      <aside id="artifact-pane" class="pane" aria-label="Planning artifacts">
        <div class="pane-title"><h2>Artifacts</h2><span>Live, read-only files</span></div>
        <div id="artifact-list"></div>
      </aside>
    </div>
  </main>
<script src="/assets/highlight.min.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
